server.address=127.0.0.1
server.port=8001
server.error.include-message=never
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=5MB
spring.datasource.url=jdbc:h2:file:./.paypilot-java/paypilot;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
paypilot.demo=true
paypilot.key-file=.paypilot-java/secret.key
paypilot.secure-cookie=false
paypilot.worker.enabled=true
paypilot.worker.interval=60000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
